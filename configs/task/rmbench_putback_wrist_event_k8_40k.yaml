# @package _global_

defaults:
  - override /data: rmbench_putback_wrist_event
  - override /model: fastwam_dynamic_surprise_memory
  - _self_

output_dir: ${oc.env:WRIST_EVENT_OUTPUT}
batch_size: 1
num_workers: 4
lr_scheduler_type: constant
learning_rate: 2.0e-4
num_epochs: 1
max_steps: 40000
log_every: 10
save_every: 5000
save_steps: []
save_training_state: true
save_final_checkpoint: true
save_portable_fsdp_checkpoint: true
keep_training_state_checkpoints: 1
checkpoint_tmp_root: /dev/shm
# The observed 5k portable export exceeded the 600-second NCCL default.
process_group_timeout_seconds: 7200
eval_every: 0
gradient_accumulation_steps: 1
weight_decay: 1.0e-2
resume: null
mixed_precision: bf16
seed: 42
max_grad_norm: 1.0
native_cache_train_mode: full

data:
  train:
    minimum_history_frames: 1

model:
  video_scheduler:
    training_sampling_scheme: logit_normal
  action_scheduler:
    training_sampling_scheme: logit_normal

wandb:
  enabled: false
  workspace: null
  project: fastwam-wrist-latent-event-memory
  name: putback-wrist-event-k8-40k-seed42
  group: null
  mode: offline
