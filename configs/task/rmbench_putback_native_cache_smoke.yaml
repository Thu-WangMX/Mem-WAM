# @package _global_

defaults:
  - override /data: rmbench_putback_fullattention
  - override /model: fastwam_native_cache_consolidation
  - _self_

output_dir: ${oc.env:NATIVE_CACHE_SMOKE_OUTPUT}
batch_size: 1
num_workers: 0
lr_scheduler_type: constant
learning_rate: 2.0e-4
num_epochs: 1
max_steps: 1
log_every: 1
save_every: 999999
save_training_state: false
save_final_checkpoint: false
eval_every: 0
eval_num_inference_steps: 10
gradient_accumulation_steps: 1
weight_decay: 1.0e-2
resume: ${oc.env:NATIVE_CACHE_BASE_CHECKPOINT}
mixed_precision: bf16
seed: 42
max_grad_norm: 1.0
native_cache_train_mode: compressor_only

data:
  train:
    minimum_history_frames: 5

wandb:
  enabled: false
  workspace: null
  project: fastwam-native-cache-consolidation
  name: putback-native-cache-smoke
  group: null
  mode: offline
