# @package _global_

defaults:
  - override /data: rmbench_putback_physical_dynamic_l
  - override /model: fastwam_physical_dynamic_l_k8
  - _self_

output_dir: ${oc.env:PUTBACK_PHYSICAL_DYNAMIC_L_OUTPUT}
batch_size: 1
num_gpus: 8
num_workers: 4
lr_scheduler_type: constant
learning_rate: 2.0e-4
num_epochs: 1
max_steps: 20000
log_every: 10
save_every: 0
save_steps: [5000, 10000, 15000, 16000, 17000, 18000, 19000, 20000]
save_training_state: true
save_training_state_every: 10000
save_final_checkpoint: true
save_portable_fsdp_checkpoint: true
keep_training_state_checkpoints: 1
checkpoint_tmp_root: /dev/shm
process_group_timeout_seconds: 7200
eval_every: 0
gradient_accumulation_steps: 1
weight_decay: 1.0e-2
resume: null
initial_weights: null
mixed_precision: bf16
seed: 42
max_grad_norm: 1.0
native_cache_train_mode: full

data:
  train:
    minimum_history_frames: 1

model:
  video_scheduler:
    training_sampling_scheme: logit_normal
  action_scheduler:
    training_sampling_scheme: logit_normal

wandb:
  enabled: false
  workspace: null
  project: fastwam-physical-dynamic-l
  name: putback-physical-dynamic-l-k8-init-joint-20k
  group: null
  mode: offline
