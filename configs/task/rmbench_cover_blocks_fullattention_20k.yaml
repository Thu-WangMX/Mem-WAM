# @package _global_

defaults:
  - override /data: rmbench_cover_blocks_fullattention
  - override /model: memorywam_fullattention
  - _self_

output_dir: ${oc.env:MEMORYWAM_COVER_BLOCKS_TRAIN_OUTPUT}
batch_size: 1
num_workers: 4
lr_scheduler_type: constant
learning_rate: 2.0e-4
num_epochs: 1
max_steps: 20000
log_every: 10
save_every: 2000
save_training_state: true
save_final_checkpoint: true
eval_every: 0
eval_num_inference_steps: 10
gradient_accumulation_steps: 1
weight_decay: 1.0e-2
resume: null
mixed_precision: bf16
seed: 42
max_grad_norm: 1.0

wandb:
  enabled: false
  workspace: null
  project: fastwam-memorywam-fullattention
  name: cover-blocks-fsdp-20k
  group: null
  mode: offline
