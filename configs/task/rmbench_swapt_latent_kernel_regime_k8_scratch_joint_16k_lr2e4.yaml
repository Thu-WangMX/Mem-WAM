# @package _global_
defaults:
  - override /data: rmbench_swapt_latent_kernel_regime
  - override /model: fastwam_latent_kernel_regime_k8
  - _self_

output_dir: ${oc.env:SWAPT_LATENT_KERNEL_OUTPUT}
batch_size: 1
num_gpus: 8
num_workers: 4
lr_scheduler_type: constant
learning_rate: 2.0e-4
num_epochs: 1
max_steps: 16000
log_every: 10
save_every: 2000
save_steps: []
save_training_state: true
save_final_checkpoint: true
save_portable_fsdp_checkpoint: true
keep_training_state_checkpoints: 1
checkpoint_tmp_root: /dev/shm
process_group_timeout_seconds: 7200
eval_every: 0
gradient_accumulation_steps: 1
weight_decay: 1.0e-2
resume: null
initial_weights: null
mixed_precision: bf16
seed: 42
max_grad_norm: 1.0
native_cache_train_mode: full
data:
  train:
    minimum_history_frames: 1
model:
  mot_checkpoint_mixed_attn: true
  video_dit_config:
    use_gradient_checkpointing: true
  action_dit_config:
    use_gradient_checkpointing: true
  video_scheduler:
    training_sampling_scheme: logit_normal
  action_scheduler:
    training_sampling_scheme: logit_normal
wandb:
  enabled: false
  project: fastwam-latent-kernel-regime
  name: swapt-latent-kernel-k8-scratch-joint16k-lr2e4-seed42
  mode: offline
