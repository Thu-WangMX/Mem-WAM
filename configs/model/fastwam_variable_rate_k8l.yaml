defaults:
  - fastwam_native_cache_consolidation

native_cache:
  enabled: true
  mode: layerwise
  # Maximum capacity: the locked selector closes at most six planning frames.
  memory_tokens: 48
  # Formal allocation rule for this experiment: K(segment) = 8 * segment length.
  dynamic_tokens_per_frame: 8
  allocation_mode: span_full
  group_size: 4
  anchor_frames: 2
  recent_frames: 4
  recursive: false
